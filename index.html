<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>KAS Sperrkarte &amp; Reklamation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: Kopfleiste mit Rolle/Sprache, Reiter je Rolle; Halle = große Kacheln für Tablet, QS = Listen + Akte mit Unterreitern */
:root{
  --bg:#eef3f1; --surface:#ffffff; --surface-2:#f5f8f7; --ink:#16231f; --muted:#5a6b66; --line:#d3dfdb;
  --accent:#427269; --accent-ink:#ffffff; --accent-soft:#dcebe7; --accent-2:#81b6ac; --paper:#fbfcf9; --draw:#2a3b37;
  --ok:#2c7a4b; --ok-soft:#e1f2e7; --warn:#a46410; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#fbe3e1; --info:#2f5f8a; --info-soft:#e2ecf6;
  --auto:#2f5f8a; --auto-soft:#e4edf7; --input:#8a4b08; --input-soft:#fdf0dc;
  --f-head:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif; --f-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1715; --surface:#17221f; --surface-2:#1c2a26; --ink:#e4eeeb; --muted:#9db0aa; --line:#2b3c37;
  --accent:#81b6ac; --accent-ink:#0f1715; --accent-soft:#22403a; --accent-2:#427269; --paper:#1a2522; --draw:#c9d9d4;
  --ok:#6fcf97; --ok-soft:#173326; --warn:#f0b35a; --warn-soft:#3a2c15; --bad:#f28b82; --bad-soft:#3d1c1a; --info:#8ab4e0; --info-soft:#1b2c3d;
  --auto:#8ab4e0; --auto-soft:#1b2c3d; --input:#f0b35a; --input-soft:#3a2c15; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1715; --surface:#17221f; --surface-2:#1c2a26; --ink:#e4eeeb; --muted:#9db0aa; --line:#2b3c37;
  --accent:#81b6ac; --accent-ink:#0f1715; --accent-soft:#22403a; --accent-2:#427269; --paper:#1a2522; --draw:#c9d9d4;
  --ok:#6fcf97; --ok-soft:#173326; --warn:#f0b35a; --warn-soft:#3a2c15; --bad:#f28b82; --bad-soft:#3d1c1a; --info:#8ab4e0; --info-soft:#1b2c3d;
  --auto:#8ab4e0; --auto-soft:#1b2c3d; --input:#f0b35a; --input-soft:#3a2c15; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--f-head);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:1.4rem} h2{font-size:1.35rem} h3{font-size:1.12rem} h4{font-size:1rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.75rem}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.toprow{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 240px}
.mark{flex:none;height:40px;width:auto}
.logo-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-dark{display:block}:root:not([data-theme="light"]) .logo-light{display:none}}
:root[data-theme="dark"] .logo-dark{display:block}:root[data-theme="dark"] .logo-light{display:none}
.brand .sub{display:block;font-size:.78rem;color:var(--muted)}
.badge-test{font:600 .7rem/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:6px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface-2)}
.seg button{border:0;background:none;padding:8px 13px;min-height:40px;font-weight:600;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.srcbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:8px 13px;min-height:40px;font-weight:600;font-size:.85rem;color:var(--muted)}
.srcbtn[aria-pressed="true"]{background:var(--auto-soft);color:var(--auto);border-color:var(--auto)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;max-width:1240px;margin:6px auto 0;scrollbar-width:none}
nav.tabs button{flex:none;border:0;background:none;padding:11px 14px;min-height:46px;font-family:var(--f-head);font-size:1.05rem;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.count{display:inline-block;min-width:22px;margin-left:6px;padding:1px 6px;border-radius:999px;background:var(--accent-soft);color:var(--ink);font:600 .75rem/1.5 var(--f-body);text-align:center}
main{padding-top:16px;display:grid;gap:16px}
.note{border-radius:var(--r);padding:10px 14px;font-size:.9rem}
.note.info{background:var(--info-soft)} .note.warn{background:var(--warn-soft)} .note.bad{background:var(--bad-soft)} .note.ok{background:var(--ok-soft)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font:600 1.55rem/1.1 var(--f-head);font-variant-numeric:tabular-nums}
.kpi span{font-size:.8rem;color:var(--muted)}
.kpi.alert b{color:var(--bad)}
.list{display:grid;gap:10px}
@media (min-width:900px){.list.two{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;min-width:0}
.card.clickable{cursor:pointer;text-align:left;width:100%}
.card.clickable:hover{border-color:var(--accent-2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.kat{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.art-intern{background:var(--warn-soft);color:var(--warn)} .art-extern,.art-feld,.art-hinweis{background:var(--bad-soft);color:var(--bad)} .art-lieferant,.art-hinweis_lief{background:var(--info-soft);color:var(--info)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:.92rem;align-items:baseline}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:16px;min-width:0}
.step{display:grid;gap:8px;min-width:0}
.lbl{font-weight:600;font-size:.92rem}
.hint{font-size:.82rem;color:var(--muted)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:10px 12px;min-height:54px;text-align:left;display:grid;gap:2px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .t{font-weight:600} .opt .d{font-size:.8rem;color:var(--muted)}
.opt.big{min-height:84px;padding:14px}
.opt.big .t{font:600 1.35rem/1.1 var(--f-head)}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 12px}
textarea{min-height:80px;resize:vertical}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid3{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;min-height:46px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.small{min-height:38px;padding:6px 12px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.confirm{border-radius:var(--r);border:1.5px solid var(--warn);background:var(--warn-soft);padding:12px 14px;display:grid;gap:10px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:.9rem}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);white-space:nowrap}
td input,td select{min-height:40px;padding:6px 8px}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tol-ok{background:var(--ok-soft)} .tol-bad{background:var(--bad-soft)}
.timeline{display:grid;gap:6px;font-size:.85rem}
.timeline div{display:grid;grid-template-columns:auto 1fr;gap:10px}
.checks{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.checks label{display:flex;gap:10px;align-items:center;min-height:42px;padding:4px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.checks input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.back{border:0;background:none;color:var(--accent);font-weight:600;padding:8px 0;min-height:40px;justify-self:start}
.empty{padding:26px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.subtabs button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 13px;min-height:40px;font-weight:600;font-size:.86rem;color:var(--muted)}
.subtabs button[aria-current="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.subtabs .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;background:var(--line);vertical-align:middle}
.subtabs .dot.ok{background:var(--ok)} .subtabs .dot.warn{background:var(--warn)} .subtabs .dot.bad{background:var(--bad)}
/* Datenherkunft */
.src{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:4px;font:600 .66rem/1.45 var(--f-body);letter-spacing:.03em;text-transform:uppercase;vertical-align:middle;white-space:nowrap}
.src.a{background:var(--auto-soft);color:var(--auto)} .src.e{background:var(--input-soft);color:var(--input)}
.legend{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:.82rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
/* Halle */
.machine-head{display:grid;gap:10px;background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:14px 16px}
.machine-head .kv dt{color:inherit;opacity:.8} .machine-head .src.a{background:rgba(255,255,255,.18);color:inherit}
.drawing{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px;overflow-x:auto}
.drawing svg{display:block;width:100%;min-width:520px;height:auto}
.balloon{cursor:pointer}
.balloon circle{fill:var(--surface);stroke:var(--draw);stroke-width:1.6}
.balloon text{fill:var(--draw);font:700 15px var(--f-mono)}
.balloon.sel circle{fill:var(--bad);stroke:var(--bad)} .balloon.sel text{fill:#fff}
.balloon:hover circle{stroke:var(--accent);stroke-width:2.4}
.pp-row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 12px;min-height:56px;text-align:left;width:100%}
.pp-row[aria-pressed="true"]{border-color:var(--bad);background:var(--bad-soft)}
.pp-pos{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:2px solid var(--draw);font:700 .95rem var(--f-mono)}
.pp-row[aria-pressed="true"] .pp-pos{background:var(--bad);border-color:var(--bad);color:#fff}
.bigval{font:600 2.1rem/1 var(--f-mono);text-align:center;letter-spacing:.02em}
input.bignum{font:600 1.8rem var(--f-mono);text-align:center;min-height:64px}
.devbar{height:14px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);position:relative;overflow:hidden}
.devbar .tol{position:absolute;top:0;bottom:0;background:var(--ok-soft)}
.devbar .mark{position:absolute;top:-2px;bottom:-2px;width:4px;border-radius:2px;background:var(--bad);height:auto}
.stepper{display:grid;grid-template-columns:56px 1fr 56px;gap:8px}
.stepper button{min-height:56px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface-2);font:600 1.5rem var(--f-head)}
.auto-box{border:1px dashed var(--auto);background:var(--auto-soft);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.auto-box ul{margin:0;padding-left:18px;display:grid;gap:2px;font-size:.88rem}
/* Jour fixe */
.agenda{display:grid;gap:12px}
.ag-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ag-num{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--surface);font:700 .95rem var(--f-head);flex:none}
.item{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:grid}
.item > button.item-head{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;background:none;border:0;text-align:left;width:100%;min-height:56px}
.item .item-body{border-top:1px solid var(--line);padding:12px;display:grid;gap:12px;background:var(--surface-2)}
.decide{display:flex;gap:6px;flex-wrap:wrap}
.decide button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:38px;font-size:.85rem;font-weight:600}
.decide button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.attendees{display:flex;gap:6px;flex-wrap:wrap}
.attendees button{border:1.5px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;min-height:38px;font-size:.85rem;font-weight:600;color:var(--muted)}
.attendees button[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
/* Statistik */
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:minmax(120px,190px) 1fr 70px;gap:10px;align-items:center;font-size:.86rem}
.bar .track{height:18px;background:var(--surface-2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;background:var(--accent)}
/* Berichte */
.report{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px}
.report .rh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--accent);padding-bottom:8px}
.report .d{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:start}
.report .d b.tag{font:700 .95rem var(--f-head);color:var(--accent-ink);background:var(--accent);border-radius:6px;text-align:center;padding:4px 0}
.ishikawa{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.photo{max-width:220px;border-radius:8px;border:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.card,.opt,.btn,.pp-row{transition:border-color .15s,background .15s}}
</style>
</head>
<body>


<header class="top">

  d:null, confirm:null, open:null, sub:'erf', msg:'', pending:false, force:false, slow:false, photo:null, rkFilter:'alle', rkNew:null, jfOpen:{}, out:'8d' };
const LS = { get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
const pref = LS.get('kas-pref2'); if (pref){ S.lang = pref.lang||'de'; S.view = pref.view||'halle'; S.showSrc = pref.src!==false; S.tab = S.view==='halle' ? 'tif' : 'ueb'; }
const t = k => (T[S.lang][k] || T.de[k] || k);
const L = o => o ? (o[S.lang] || o.de) : '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const art = id => ARTIKEL.find(a => a.id === id);
const mm = (a, pos) => a ? a.merkmale.find(m => m.pos === pos) : null;
const fk = k => FKAT.find(f => f.k === k);
const loc = () => S.lang==='cs' ? 'cs-CZ' : 'de-DE';
const nf = (n, d=2) => Number(n||0).toLocaleString(loc(), {minimumFractionDigits:d, maximumFractionDigits:d});
const eur = n => nf(n,2) + ' €';
const dt = iso => iso ? new Date(iso).toLocaleString(loc(), {day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit'}) : '';
const dd = iso => iso ? new Date(iso).toLocaleDateString(loc(), {day:'2-digit', month:'2-digit', year:'numeric'}) : '';
const days = iso => Math.max(0, Math.floor((Date.now() - new Date(iso)) / 86400000));
const dec = m => m.dp ?? Math.max(1, ...[m.lo, m.hi].map(x => { const s = String(x); return s.includes('.') ? Math.min(3, s.split('.')[1].length) : 0; }));
const tolTxt = m => m.typ==='num' ? `${nf(m.lo, dec(m))} – ${nf(m.hi, dec(m))}` : t('io')+' / '+t('nio');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const src = (k, kind='a') => S.showSrc ? `<span class="src ${kind}">${esc(kind==='e' ? t('s_in') : t(k))}</span>` : '';
const srcIn = () => src('s_in','e');
function nextNr(prefix, list){ const y = String(new Date().getFullYear()).slice(2); let max = 0; list.forEach(x => { const m = String(x.nr||'').match(/-(\d+)$/); if (m) max = Math.max(max, +m[1]); }); return `${prefix}-${y}-${String(max+1).padStart(4,'0')}`; }
function addWorkdays(d, n){ const x = new Date(d); let k = 0; while (k < n){ x.setDate(x.getDate()+1); const w = x.getDay(); if (w && w !== 6) k++; } return x; }
function fristFor(kat, from){ const f = KAT[kat].frist; return f.h ? new Date(new Date(from).getTime() + f.h*3600000) : addWorkdays(from, f.at); }
function schichtNow(){ const h = new Date().getHours(); return h >= 6 && h < 14 ? 'Früh' : h >= 14 && h < 22 ? 'Spät' : 'Nacht'; }
function schichtTxt(s){ if (S.lang!=='cs') return s; return {Früh:'ranní', Spät:'odpolední', Nacht:'noční'}[s] || s; }
function nextThursday(){ const d = new Date(); const add = (4 - d.getDay() + 7) % 7; d.setDate(d.getDate() + add); d.setHours(9,0,0,0); return d; }
function kategorie(artKey, wert, auftreten){
  const map = {hinweis:5, extern:6, feld:7, hinweis_lief:8, lieferant:9};
  if (artKey !== 'intern') return {kat:map[artKey], why:t('a_'+artKey)};
  const byW = wert < 100 ? 1 : wert < 500 ? 2 : wert < 2000 ? 3 : 4;
  const byA = auftreten >= 3 ? 4 : auftreten >= 2 ? 3 : 1;
  const wTxt = ['0–99 €','100–499 €','500–1.999 €','≥ 2.000 €'][byW-1];
  return {kat:Math.max(byW, byA), why:`${t('a_intern')} · ${t('wert')} ${eur(wert)} (${wTxt}) · ${t('auftreten')} ${auftreten}×${byA>byW?' → '+t('kat')+' '+byA:''}`};
}
const auftretenFor = (artikel, fkat) => 1 + S.rk.filter(r => r.artikel === artikel && r.fkat === fkat && r.art === 'intern' && (Date.now() - new Date(r.erstellt)) < 365*86400000).length;
const ev = (e, x) => ({ t:new Date().toISOString(), u:S.me, e, x:x||'' });
const skWert = s => { const a = art(s.artikel); return a ? a.vk * (s.menge||0) : 0; };
const name = u => !u ? t('someone') : u === S.me ? t('you') : (S.names[u] || t('someone'));

async function put(coll, obj){
  if (S.mode === 'db'){
    try { await S.db.doc(coll + '/' + obj.id).set(obj); }
    catch(err){ if (err && err.code === 'invalid_argument') S.canWrite = false; flash((err && err.message) || 'Fehler'); throw err; }
  } else {
    const key = coll===C_SK ? 'sk' : coll===C_RK ? 'rk' : 'jf'; const list = S[key];
    const i = list.findIndex(x => x.id === obj.id); if (i >= 0) list[i] = obj; else list.push(obj);
    LS.set('kas-demo2', {sk:S.sk, rk:S.rk, jf:S.jf}); S.force = true; render();
  }
}
function flash(m){ S.msg = m; S.force = true; render(); setTimeout(() => { if (S.msg === m){ S.msg=''; S.force = true; render(); } }, 3500); }
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- Zeichnungsskizze mit Positionsnummern ---------- */
function drawing(a, sel){
  const W = 640, H = 270, x0 = 70, len = a.stufen.reduce((n,s) => n+s.l, 0), dmax = Math.max(...a.stufen.map(s => s.d));
  const sx = 440 / len, sy = Math.min(9, 150 / dmax), cy = 120;
  let x = x0, top = [], bot = [], segs = [];
  a.stufen.forEach((s, i) => { const w = s.l*sx, h = s.d*sy/2; segs.push({x, w, h, s}); top.push(`${x},${cy-h} ${x+w},${cy-h}`); bot.unshift(`${x+w},${cy+h} ${x},${cy+h}`); x += w; });
  let path = '';
  segs.forEach((g,i) => { path += `<rect x="${g.x}" y="${cy-g.h}" width="${g.w}" height="${g.h*2}" fill="none" stroke="var(--draw)" stroke-width="2"/>`;
    if (g.s.gew){ for (let k = g.x+4; k < g.x+g.w-2; k += 5) path += `<line x1="${k}" y1="${cy-g.h}" x2="${k+3}" y2="${cy-g.h+5}" stroke="var(--draw)" stroke-width=".8"/><line x1="${k}" y1="${cy+g.h}" x2="${k+3}" y2="${cy+g.h-5}" stroke="var(--draw)" stroke-width=".8"/>`; } });
  if (a.bohrung){ const h = a.bohrung*sy/2; path += `<line x1="${x0}" y1="${cy-h}" x2="${x}" y2="${cy-h}" stroke="var(--draw)" stroke-width="1.2" stroke-dasharray="6 4"/><line x1="${x0}" y1="${cy+h}" x2="${x}" y2="${cy+h}" stroke="var(--draw)" stroke-width="1.2" stroke-dasharray="6 4"/>`; }
  if (a.fase){ const g = segs[segs.length-1]; path += `<line x1="${g.x+g.w-6}" y1="${cy-g.h}" x2="${g.x+g.w}" y2="${cy-g.h+6}" stroke="var(--draw)" stroke-width="2"/>`; }
  path += `<line x1="${x0-20}" y1="${cy}" x2="${x+20}" y2="${cy}" stroke="var(--draw)" stroke-width=".8" stroke-dasharray="14 4 3 4"/>`;
  let ann = '';
  const balloon = (pos, bx, by, ax, ay) => `<g class="balloon ${sel===pos?'sel':''}" data-action="pickM" data-v="${pos}" role="button" tabindex="0" aria-label="${esc(t('pos'))} ${pos}"><line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="var(--draw)" stroke-width="1"/><circle cx="${bx}" cy="${by}" r="16"/><text x="${bx}" y="${by+5}" text-anchor="middle">${pos}</text></g>`;
  a.merkmale.forEach((m, i) => {
    const b = m.b || {};
    if (b.t === 'dia'){ const g = segs[b.seg]; const mx = g.x + g.w/2; ann += `<line x1="${mx}" y1="${cy-g.h}" x2="${mx}" y2="${cy+g.h}" stroke="var(--muted)" stroke-width="1" marker-start="url(#ar)" marker-end="url(#ar)"/>` + balloon(m.pos, mx, cy-g.h-42 - (i%2)*6, mx, cy-g.h); }
    else if (b.t === 'bore'){ const h = (a.bohrung||4)*sy/2; const bx = x0 + 18; ann += balloon(m.pos, x0 - 34, cy - 4, bx, cy - h + 2); }
    else if (b.t === 'len'){ const yy = cy + Math.max(...segs.map(g=>g.h)) + 28; ann += `<line x1="${x0}" y1="${yy}" x2="${x}" y2="${yy}" stroke="var(--muted)" stroke-width="1" marker-start="url(#ar)" marker-end="url(#ar)"/>` + balloon(m.pos, (x0+x)/2, yy + 30, (x0+x)/2, yy); }
    else if (b.t === 'edge'){ const g = segs[segs.length-1]; ann += balloon(m.pos, g.x + g.w + 40, cy - g.h - 30, g.x + g.w - 2, cy - g.h + 3); }
    else if (b.t === 'surf'){ const g = segs[b.seg]; const px = g.x + g.w*0.78; ann += `<path d="M${px-8},${cy+g.h+12} l5,8 l10,-20" fill="none" stroke="var(--muted)" stroke-width="1.2"/>` + balloon(m.pos, px + 34, cy + g.h + 38, px + 2, cy + g.h + 2); }
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(L(a))}"><defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
    <rect x="1" y="1" width="${W-2}" height="${H-2}" fill="none" stroke="var(--line)"/>${path}${ann}
    <text x="${W-12}" y="${H-12}" text-anchor="end" fill="var(--muted)" style="font:12px var(--f-mono)">${esc(a.id)} · ${esc(a.zgs)}</text></svg>`;
}

/* ---------- Kopf und Rahmen ---------- */
function setHead(){
  document.documentElement.lang = S.lang;
  const $ = id => document.getElementById(id);
  $('appTitle').textContent = t('title'); $('appSub').textContent = t('sub'); $('testBadge').textContent = t('test');
  $('srcBtn').textContent = t('src'); $('srcBtn').setAttribute('aria-pressed', S.showSrc);
  $('vHalle').textContent = t('vHalle'); $('vQs').textContent = t('vQs');
  $('vHalle').setAttribute('aria-pressed', S.view==='halle'); $('vQs').setAttribute('aria-pressed', S.view==='qs');
  $('lDe').setAttribute('aria-pressed', S.lang==='de'); $('lCs').setAttribute('aria-pressed', S.lang==='cs');
  const nOpen = S.sk.filter(s => s.status==='offen').length, nNa = S.sk.filter(s => s.status==='nacharbeit').length, nRk = S.rk.filter(r => r.status==='B').length;
  const tabs = S.view==='halle' ? [['tif','t_tif'],['na','t_na',nNa],['mine','t_mine']] : [['ueb','t_ueb',nOpen],['rk','t_rk',nRk],['jf','t_jf'],['stat','t_stat'],['tif','t_tif'],['na','t_na',nNa]];
  if (!tabs.some(x => x[0]===S.tab)) S.tab = tabs[0][0];
  $('tabs').innerHTML = tabs.map(([k,l,c]) => `<button data-action="tab" data-v="${k}" ${S.tab===k && !S.open?'aria-current="page"':''}>${esc(t(l))}${c?`<span class="count">${c}</span>`:''}</button>`).join('');
}
function render(){
  const a = document.activeElement;
  if (!S.force && a && a.closest && a.closest('#main') && /INPUT|TEXTAREA|SELECT/.test(a.tagName)){ S.pending = true; setHead(); return; }
  S.force = false; S.pending = false; setHead();
  let h = '';
  if (S.msg) h += `<div class="note ok" role="status">${esc(S.msg)}</div>`;
  if (S.mode === 'loading') h += `<div class="note info">${esc(t('loading'))}</div>`;
  if (S.mode === 'local') h += `<div class="note warn row between"><span>${esc(t('local'))}</span><button class="btn small" data-action="examples">${esc(S.lang==='cs'?'Obnovit ukázková data':'Beispieldaten zurücksetzen')}</button></div>`;
  if (S.slow && S.mode === 'db') h += `<div class="note warn">${esc(t('slow'))}</div>`;
  if (!S.canWrite) h += `<div class="note bad">${esc(t('readonly'))}</div>`;
  if (S.showSrc) h += `<div class="legend"><span class="src a">${esc(t('legendA'))}</span><span class="src e">${esc(t('legendE'))}</span><span class="muted">${esc(t('legendTxt'))}</span></div>`;
  if (S.open?.type === 'sk') h += viewSk(S.sk.find(x => x.id === S.open.id));
  else if (S.open?.type === 'na') h += viewNa(S.sk.find(x => x.id === S.open.id));
  else if (S.open?.type === 'rk') h += viewRk(S.rk.find(x => x.id === S.open.id));
  else h += ({tif:viewTif, na:viewNaList, mine:viewMine, ueb:viewUeb, rk:viewRkList, jf:viewJf, stat:viewStat}[S.tab] || viewUeb)();
  document.getElementById('main').innerHTML = h;
  if (S.photo){ const img = document.getElementById('photoPrev'); if (img) img.src = S.photo; }
}
function stChip(s){ const c = {offen:'bad', nacharbeit:'warn', qs:'info', verschrottet:'', freigabe:'info', rekla:'info', erledigt:'ok'}[s] ?? ''; return `<span class="chip ${c}">${esc(t('st_'+s))}</span>`; }

/* ---------- Halle: Sperrkarte erfassen (TiF) ---------- */
function viewTif(){
  const d = S.d || (S.d = {m:null, pos:null, ist:'', fkat:'', menge:'', kisten:1, bem:''});
  let h = `<div class="panel"><div class="section-title"><h2>${esc(t('t_tif'))}</h2><span class="muted small">${esc(t('schicht'))}: ${esc(schichtTxt(schichtNow()))} ${src('s_clock')}</span></div>
  <div class="step"><span class="lbl">1 · ${esc(t('choose_m'))}</span><div class="pick">${MASCH.map(m => { const b = BA[m.ba]; const a = art(b.artikel);
    return `<button class="opt big" data-action="pickMa" data-v="${m.nr}" aria-pressed="${d.m===m.nr}"><span class="t">${esc(m.nr)}</span><span class="d">${esc(m.typ)} · ${esc(t('running'))}: ${esc(L(a))}</span></button>`; }).join('')}</div></div>`;
  if (d.m){
    const ma = MASCH.find(x => x.nr === d.m), b = BA[ma.ba], a = art(b.artikel), m = mm(a, d.pos);
    h += `<div class="machine-head"><div class="row between"><h3>${esc(L(a))} <span class="mono">${esc(a.id)}</span></h3><span>${esc(t('machine'))} ${esc(ma.nr)}</span></div>
      <dl class="kv"><dt>${esc(t('ba'))}</dt><dd class="mono">${esc(ma.ba)} ${src('s_mde')}</dd><dt>${esc(t('charge'))}</dt><dd class="mono">${esc(b.charge)} ${src('s_ba')}</dd>
      <dt>${esc(t('zgs'))}</dt><dd>${esc(a.zgs)} ${src('s_art')}</dd><dt>${esc(t('fq'))}</dt><dd class="mono">${nf(b.fq,1)} % ${src('s_mde')}</dd></dl></div>
    <div class="step"><span class="lbl">2 · ${esc(t('pp'))} ${src('s_pp')}</span><span class="hint">${esc(t('pp_hint'))}</span>
      <div class="drawing">${drawing(a, d.pos)}</div>
      <div class="list">${a.merkmale.map(x => `<button class="pp-row" data-action="pickM" data-v="${x.pos}" aria-pressed="${d.pos===x.pos}"><span class="pp-pos">${x.pos}</span><span><b>${esc(L(x))}</b><br><span class="small muted">${esc(t('pm'))}: ${esc(S.lang==='cs'?x.pmcs:x.pm)}</span></span><span class="mono small">${esc(tolTxt(x))}</span></button>`).join('')}</div></div>`;
    if (m){
      const v = d.ist === '' ? null : +d.ist;
      let abw = '';
      if (m.typ==='num' && v != null){ abw = v > m.hi ? 'gross' : v < m.lo ? 'klein' : 'tol'; }
      h += `<div class="grid2"><div class="step"><span class="lbl">3 · ${esc(t('ist'))} ${srcIn()}</span>`;
      if (m.typ === 'num'){
        const span = (m.hi - m.lo) || 1, lo = m.lo - span*1.5, hi = m.hi + span*1.5, p = x => Math.max(0, Math.min(100, (x - lo) / (hi - lo) * 100));
        h += `<input class="bignum" id="fIst" type="number" inputmode="decimal" step="any" data-bind="ist" value="${esc(d.ist)}" aria-label="${esc(t('ist'))}">
          <span class="hint mono">${esc(t('tol'))} ${esc(tolTxt(m))}</span>
          <div class="devbar" aria-hidden="true"><div class="tol" style="left:${p(m.lo)}%;width:${p(m.hi)-p(m.lo)}%"></div>${v!=null?`<div class="mark" style="left:calc(${p(v)}% - 2px)"></div>`:''}</div>
          ${abw?`<span class="chip ${abw==='tol'?'ok':'bad'}" style="justify-self:start">${esc(abw==='tol'?t('in_tol'):t(abw==='gross'?'zu_gross':'zu_klein'))} ${v!=null && abw!=='tol' ? '· '+(v>m.hi?'+':'−')+nf(Math.abs(v>m.hi?v-m.hi:m.lo-v), dec(m)) : ''} ${src('s_calc')}</span>`:''}`;
      } else h += `<div class="chip bad" style="justify-self:start;padding:10px 14px">${esc(t('attr_nio'))}</div>`;
      h += `</div><div class="step"><span class="lbl">4 · ${esc(t('fehler'))} ${m.typ==='num'?src('s_calc'):srcIn()}</span><div class="pick">${FKAT.slice(0,8).map(f => `<button class="opt" data-action="pickF" data-v="${f.k}" aria-pressed="${(d.fkat || (m.typ==='num'?'mass':''))===f.k}"><span class="t">${esc(L(f))}</span></button>`).join('')}</div></div></div>
      <div class="grid2"><div class="step"><span class="lbl">5 · ${esc(t('menge'))} ${srcIn()}</span>

        <span class="hint">${esc(t('ba'))}: ${b.gut} / ${b.menge} ${esc(t('stk'))}</span></div>
        <div class="step"><span class="lbl">${esc(t('kisten'))} ${srcIn()}</span><div class="stepper"><button data-action="kist" data-v="-1" aria-label="−">−</button><div class="bigval">${d.kisten}</div><button data-action="kist" data-v="1" aria-label="+">+</button></div>

      <div class="step"><label for="fBem" class="lbl">${esc(t('bem'))}</label><textarea id="fBem" data-bind="bem">${esc(d.bem)}</textarea></div>

        <li>${esc(t('ba'))} ${esc(ma.ba)}, ${esc(t('charge'))} ${esc(b.charge)}, ${esc(t('zgs'))} ${esc(a.zgs)} ${src('s_mde')}</li>
        <li>${esc(t('schicht'))} ${esc(schichtTxt(schichtNow()))}, Datum/Uhrzeit, festgestellt von ${src('s_login')}</li>
        <li>${esc(t('wert'))}: ${eur(a.vk * (+d.menge||0))} (${nf(a.vk)} €/${esc(t('stk'))} × ${esc(d.menge||0)}) ${src('s_calc')}</li>

  else if (d.m) h += `<div class="actions"><button class="btn primary" data-action="saveSk" ${S.canWrite?'':'disabled'}>${esc(t('save_sk'))}</button><button class="btn" data-action="resetD">${esc(t('cancel'))}</button></div>`;
  return h + `</div>`;
}
async function saveSk(force){
  const d = S.d; if (!d || !d.m) return;
  const ma = MASCH.find(x => x.nr === d.m), b = BA[ma.ba], a = art(b.artikel), m = mm(a, d.pos);
  const miss = []; if (!m) miss.push(t('pp')); if (m && m.typ==='num' && d.ist==='') miss.push(t('ist')); if (!(+d.menge>0)) miss.push(t('menge'));
  if (miss.length){ flash(t('need') + ' ' + miss.join(', ')); return; }
  const fkat = d.fkat || (m.typ==='num' ? 'mass' : 'sonst');
  if (!force){
    const w = [];
    if (m.typ==='num'){ const v = +d.ist; if (v >= m.lo && v <= m.hi) w.push(t('p_intol')); const span = (m.hi-m.lo)||1; if (Math.abs(v - (m.nenn||m.hi)) > Math.max(span*40, (m.nenn||1)*0.3)) w.push(t('p_far')); }
    if (+d.menge > b.gut) w.push(`${t('p_menge')} (${b.gut} ${t('stk')})`);
    if (w.length){ S.confirm = w; S.force = true; render(); return; }
  }
  const v = m.typ==='num' ? +d.ist : null;
  const s = { id:uid(), nr:nextNr('SK', S.sk), erstellt:new Date().toISOString(), maschine:ma.nr, ba:ma.ba, artikel:a.id, charge:b.charge, zgs:a.zgs, schicht:schichtNow(),
    merkmal:m.pos, ist:v, abw: v==null ? 'nio' : v > m.hi ? 'gross' : v < m.lo ? 'klein' : 'tol', fkat, menge:+d.menge, kisten:d.kisten, bem:d.bem||'', lagerplatz:'S', status:'offen', sprache:S.lang, verlauf:[ev('e_create')] };
  S.confirm = null;
  try { await put(C_SK, s); S.d = null; S.photo = null; S.open = {type:'sk', id:s.id}; flash(t('saved') + ' · ' + s.nr); } catch(e){}

function report(r, kind){

  const D = (tag, body) => `<div class="d"><b class="tag">${tag}</b><div>${body}</div></div>`;
  const list = arr => arr.length ? `<ul style="margin:0;padding-left:18px">${arr.join('')}</ul>` : `<span class="muted">${esc(t('none'))}</span>`;
  const msL = list(ms.map(x => `<li>${esc(x.t||'—')} <span class="muted small">(${esc(t('ro_'+(x.r||'qs')))}, ${esc(x.d||'—')})</span></li>`));
  if (kind === '8d') return `<div class="report">${head('8D-Report')}
    ${D('D1', esc(KAT[r.kat].kreis.map(x => T.de['r_'+x]).join(', ')))}
    ${D('D2', `${esc(an.problem||r.beschr||'—')}${m?`<br><span class="small muted">${esc(t('pos'))} ${m.pos} ${esc(m.de)} · ${esc(tolTxt(m))}${r.ist!=null?' · Ist '+esc(nf(r.ist, dec(m))):''}</span>`:''}<br><span class="small muted">${r.menge} Stk. · ${eur(r.wert)}</span>`)}
    ${D('D3', list(so.map(x => `<li>${esc(T.de['so_'+x.k])}${x.anz?` – ${esc(x.anz)} Stk. (gut ${esc(x.gut||0)}, schlecht ${esc(x.schl||0)})`:''}</li>`)))}
    ${D('D4', `${esc(an.ursache||'—')}${w.length?`<br><span class="small muted">${w.map((x,i)=>`${i+1}. ${esc(x)}`).join(' → ')}</span>`:''}`)}
    ${D('D5/D6', msL)}
    ${D('D7', esc(Object.keys(r.dok?.x||{}).filter(k => r.dok.x[k]).map(k => T.de['dk_'+k]).join(', ') || 'Dokumentenprüfung: keine Änderung nötig'))}
    ${D('D8', r.status==='E' ? 'abgeschlossen' : 'offen')}</div>`;
  if (kind === '5w') return `<div class="report">${head('5W-Analyse')}${D('P', esc(an.problem||r.beschr||'—'))}${(an.warum||['','','','','']).map((x,i) => D('W'+(i+1), esc(x||'—'))).join('')}${D('U', esc(an.ursache||'—'))}</div>`;
  if (kind === 'a4') return `<div class="report">${head('A4-Problemlösung')}<div class="grid2" style="align-items:start">
    <div class="step"><b>1 · Problem</b><span>${esc(an.problem||r.beschr||'—')}</span><b>2 · Einflussgrößen</b>${list(ISHI.filter(k => an.ishi?.[k]).map(k => `<li><b>${esc(T.de['i_'+k])}:</b> ${esc(an.ishi[k])}</li>`))}<b>3 · Ursache</b><span>${esc(an.ursache||'—')}</span></div>
    <div class="step"><b>4 · Maßnahmen</b>${msL}<b>5 · Wirksamkeit</b><span>${r.wirk?.erg==='ok'?'wirksam':r.wirk?.erg==='nok'?'nicht wirksam':'Prüfung beim nächsten BA'}</span></div></div></div>`;
  return `<div class="report">${head('A5-Prozesslektion')}${D('?', `<b>Was ist passiert?</b><br>${esc(an.problem||r.beschr||'—')}`)}${D('!', `<b>Warum?</b><br>${esc(an.ursache||'—')}`)}${D('→', `<b>Was tun wir jetzt?</b><br>${esc(ms.map(x=>x.t).filter(Boolean).join('; ')||'—')}`)}${m?D('Pos', `<b>Darauf achten:</b> ${esc(t('pos'))} ${m.pos} ${esc(m.de)} – ${esc(tolTxt(m))}, prüfen mit ${esc(m.pm)}`):''}</div>`;
}

/* ---------- Statistik ---------- */
function viewStat(){
  const yr = S.rk.filter(r => Date.now() - new Date(r.erstellt) < 365*86400000);
  const by = (arr, key, val) => { const o = {}; arr.forEach(x => { const k = key(x); o[k] = (o[k]||0) + val(x); }); return Object.entries(o).sort((a,b) => b[1]-a[1]); };
